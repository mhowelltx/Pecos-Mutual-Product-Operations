<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><style>
body{margin:0}
.cv{position:relative;width:960px;height:300px;background:var(--white);overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.midnight{fill:var(--midnight)}.navy{fill:var(--navy)}.gold{fill:var(--gold)}.orange{fill:var(--orange)}.alt{fill:var(--surface-alt)}.sky{fill:var(--sky)}
.rule{stroke:var(--gold);stroke-width:1}
.txt{position:absolute;left:40px;bottom:40px;max-width:420px}
.name{font-family:var(--font-headline);font-weight:700;font-size:96px;line-height:.95;color:var(--midnight);letter-spacing:.01em}
.tag{font-family:var(--font-body);font-size:14px;color:var(--body-accessible);margin-top:16px;letter-spacing:.02em}
</style></head><body><div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: midnight 280x300 slab, navy 160x180, surface-alt 160x120, gold 80x80, orange 80x40 — all square (radius-none)
     arrangement: one tall midnight slab with satellites, bleeding off top/bottom/right like the site's dark masthead beside white sections
     pattern: literal motif — the gold five-point star between hairlines, the system's section divider, scaled up on the slab
     steps: space-small 24, space-med 40, space-80 80; radius-none -->
<rect class="alt" x="520" y="0" width="160" height="120"/>
<rect class="navy" x="520" y="120" width="160" height="180"/>
<rect class="gold" x="600" y="40" width="80" height="80"/>
<rect class="midnight" x="680" y="0" width="280" height="300"/>
<rect class="orange" x="520" y="260" width="80" height="40"/>
<g transform="translate(820 140)"><path class="gold" d="M0 -64 L15.04 -20.7 L60.87 -19.78 L24.34 7.9 L37.62 51.78 L0 25.6 L-37.62 51.78 L-24.34 7.9 L-60.87 -19.78 L-15.04 -20.7Z"/></g>
<line class="rule" x1="704" y1="226" x2="790" y2="226"/><line class="rule" x1="850" y1="226" x2="936" y2="226"/>
</svg>
<div class="txt"><div class="name">Pecos<br>Mutual</div><div class="tag">Workers' compensation that works — a demo brand system.</div></div>
</div></body></html>
